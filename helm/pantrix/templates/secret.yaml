{{- if not .Values.postgres.existingSecret }}
{{- /* Keep the generated password stable across upgrades. */}}
{{- $name := include "pantrix.dbSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := randAlphaNum 24 }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pantrix.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username $password (include "pantrix.dbHost" .) .Values.postgres.database | quote }}
{{- end }}
