{{- $fullname := include "pantrix.fullname" . }}
{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
# Only backend pods (API + migration init container) may reach PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "pantrix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pantrix.selector" (list . "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pantrix.selector" (list . "backend") | nindent 14 }}
      ports:
        - port: 5432
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "backend" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "pantrix.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "pantrix.selector" (list $ $component) | nindent 6 }}
{{- end }}
{{- end }}
