apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pantrix.fullname" . }}-test-api
  labels:
    {{- include "pantrix.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api-check
      image: {{ include "pantrix.image" (list . "backend") }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "pantrix.fullname" . }}-backend:{{ .Values.backend.port }}"
          assert json.load(urllib.request.urlopen(base + "/ready"))["status"] == "ready"
          print("items:", len(json.load(urllib.request.urlopen(base + "/api/items"))))
      securityContext:
        {{- include "pantrix.containerSecurity" . | nindent 8 }}
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
