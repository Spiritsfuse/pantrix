# Local single-node cluster for the live demo and the CI deploy rehearsal.
# Host ports 80/443 reach ingress-nginx, so http://pantrix.localtest.me works
# (localtest.me is public DNS that always resolves to 127.0.0.1).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
