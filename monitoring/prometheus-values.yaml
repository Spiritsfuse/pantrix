# kube-prometheus-stack values for the Pantrix demo cluster (chart 92.3.0).
# Trimmed to fit a laptop: no Alertmanager HA, short retention, small requests.
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace --version 92.3.0 -f monitoring/prometheus-values.yaml

fullnameOverride: kps

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [prometheus.localtest.me]
    paths: [/]
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    # Discover ServiceMonitors/rules from every namespace, not only this release's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

alertmanager:
  # Alert rules still evaluate in Prometheus (see the Alerts page); routing them
  # to a receiver is out of scope for the laptop demo, so Alertmanager is off.
  enabled: false

grafana:
  enabled: true
  # The ~25 bundled Kubernetes dashboards make Grafana's search indexer spin on a
  # laptop; only the Pantrix dashboard (and Explore) are needed for the demo.
  defaultDashboardsEnabled: false
  # Created by scripts/monitoring/install-monitoring.sh with a random password.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.localtest.me]
  defaultDashboardsTimezone: Asia/Kolkata
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 768Mi }

prometheus-node-exporter:
  # Docker Desktop/kind nodes do not expose a useful host /proc; skip it.
  enabled: false
nodeExporter:
  enabled: false

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 192Mi }

# Control-plane components in kind are not reachable for scraping.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
