# Alert rules for Pantrix, picked up by the Prometheus Operator.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pantrix-alerts
  namespace: pantrix
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: pantrix.rules
      rules:
        - alert: PantrixBackendDown
          expr: absent(up{job="pantrix-backend"} == 1)
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No Pantrix backend target is up
            runbook_url: docs/runbooks/backend-down.md
        - alert: PantrixHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="pantrix-backend",status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{job="pantrix-backend"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of Pantrix API requests are failing
        - alert: PantrixSlowRequests
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="pantrix-backend"}[5m]))) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Pantrix API p95 latency is above 500 ms
