# Desired state for the "dev" environment, reconciled by Argo CD.
# Promotion = changing image.tag to a Git SHA that CI built, scanned and pushed
# (done by .github/workflows/promote.yml or by hand). Never "latest".
image:
  registry: ghcr.io/spiritsfuse
  tag: "771aad395276d14e8adc6c651c1e5a4c2ad0d8bf"
postgres:
  # Argo CD renders charts without cluster access, so the chart cannot look up a
  # generated password; bootstrap-gitops.sh creates this Secret once instead.
  existingSecret: pantrix-db
ingress:
  host: pantrix-gitops.localtest.me
serviceMonitor:
  # The Helm-installed release in namespace "pantrix" is the one scraped for the
  # demo dashboard; keep this copy out of the same Prometheus job.
  enabled: false
# The GitOps rehearsal shares a laptop with the Helm-installed release, so it
# runs one replica of each tier; the Helm release keeps the 2+2 baseline.
backend:
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
frontend:
  autoscaling:
    minReplicas: 1
    maxReplicas: 2
podDisruptionBudget:
  enabled: false
